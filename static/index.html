<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Print</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--pri:#2563eb;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2027;--tx:#e8eaed;--mut:#9aa3af;--bd:#2d343d}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
button,select,input[type=number],.btn{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px}
button.p,.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
button.x{padding:8px 12px;color:#dc2626}
select:disabled{opacity:.5}
#pv{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto}
.pvstage{display:flex;gap:10px;justify-content:center;align-items:flex-start;margin:10px 0}
.pvsheet{flex:1;min-width:0;max-width:420px;text-align:center}
.pvsheet img{width:100%;display:block;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.35);background:#fff;min-height:120px}
.lg{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:4px;border-radius:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.mut{color:var(--mut);font-size:14px}
input[type=tel]{font:inherit;font-size:28px;letter-spacing:12px;text-align:center;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.btn{display:inline-block;cursor:pointer}
#dlg{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pg{display:flex;flex-direction:column;gap:4px;font-size:13px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px}
.pg img{width:100%;border-radius:6px;background:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field select,.field input{width:100%}
.sheet{text-align:center;margin:12px 0}
.sheet img{width:100%;max-width:420px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📄 Phone Print</h1>

  <div id="login" class="card" hidden>
    <p>Enter the 4-digit PIN shown on the PC</p>
    <input id="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off">
    <p id="lerr" style="color:#dc2626"></p>
    <button id="go" class="p" style="width:100%">Open</button>
  </div>

  <div id="main" hidden>
    <div class="card">
      <label class="btn p">Choose files (PDF / images)
        <input id="pick" type="file" multiple accept=".pdf,image/*" hidden>
      </label>
      <p id="ustat" class="mut"></p>
    </div>
    <div id="list"></div>
    <div id="all" class="card" hidden>
      <div class="name">Print all (merged)</div>
      <p class="mut">PDF and images are never mixed together.</p>
      <div class="row" id="allbtns"></div>
      <p><button id="clear" class="x">Remove all files</button></p>
    </div>
  </div>
</div>

<div id="dlg" hidden>
  <div class="wrap">
    <div class="row"><button id="close">← Back</button><div class="name grow" id="ptitle"></div></div>
    <p class="mut">Select pages to print</p>
    <div class="grid" id="pgrid"></div>
    <div class="card" style="margin-top:14px">
      <div class="field"><label>Printer</label><select id="printer"></select></div>
      <div class="field"><label>Profile (saved driver settings)</label>
        <select id="profile"><option value="">None (normal way)</option></select>
        <div class="row">
          <button id="bprof" class="grow">⚙ Printer Properties (save as profile)</button>
          <button id="bdel" class="x" hidden>🗑 Delete</button>
        </div>
        <p class="mut" id="pnote"></p>
      </div>
      <div class="field"><label>Paper size</label><select id="paper"></select></div>
      <div class="field"><label>Orientation</label>
        <select id="orient">
          <option value="auto">Auto (match the page)</option>
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select></div>
      <div class="field"><label>Color</label><select id="color"></select></div>
      <div class="field" id="duprow"><label>Two-sided</label>
        <select id="duplex">
          <option value="off">Off (one side)</option>
          <option value="long">Long edge</option>
          <option value="short">Short edge</option>
        </select></div>
      <div class="field"><label>Copies</label><input id="copies" type="number" min="1" max="99" value="1" inputmode="numeric"></div>
      <div class="field"><label>Scaling</label><select id="scale"></select>
        <div id="pctbox" class="row" hidden>
          <button id="pctm" type="button">−</button>
          <input id="pct" type="number" min="10" max="400" step="5" value="100" inputmode="numeric" style="width:90px">
          <span>%</span>
          <button id="pctp" type="button">+</button>
        </div>
        <input id="pctr" type="range" min="10" max="300" step="5" value="100" hidden>
        <p class="mut" id="scnote"></p></div>
      <p class="mut" id="dnote"></p>
      <div class="row">
        <button id="bprev" class="grow">👁 Preview</button>
        <button id="bprint" class="grow p">🖨 Print</button>
      </div>
      <p id="pmsg"></p>
    </div>
  </div>
</div>

<div id="pv" hidden>
  <div class="wrap">
    <div class="row"><button id="pvclose">✕ Close</button><div class="name grow" id="pvtitle">Print preview</div></div>
    <div class="field" style="margin-top:12px"><label>Scaling</label><select id="pvscale"></select>
      <div id="pvpct" class="row" hidden>
        <button id="pvpm" type="button">−</button><span class="name" id="pvpv">100%</span><button id="pvpp" type="button">+</button>
      </div>
    </div>
    <div class="pvstage" id="pvstage"></div>
    <div class="row" style="justify-content:center">
      <button id="pvprev">‹ Prev</button><span id="pvpos" class="name"></span><button id="pvnext">Next ›</button>
    </div>
    <p class="mut" style="text-align:center">
      <span class="lg" style="background:#cdd0d6;border:1px solid #888"></span>printer cannot print here &nbsp;
      <span class="lg" style="background:#fff;border:2px dashed #2563eb"></span>printable area
    </p>
    <p class="mut" id="pvinfo"></p>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
let FILES=[],CAPS=null,CUR=null;
function el(t,props={},...kids){const e=document.createElement(t);Object.assign(e,props);kids.forEach(k=>e.append(k));return e}
async function api(url,opt){const r=await fetch(url,opt);if(r.status===401){show('login');throw new Error('login')}return r}
function show(v){$('#login').hidden=v!=='login';$('#main').hidden=v!=='main'}
const JH={'Content-Type':'application/json'};

$('#go').onclick=async()=>{
  const r=await fetch('/api/login',{method:'POST',headers:JH,body:JSON.stringify({pin:$('#pin').value})});
  const j=await r.json();
  if(r.ok){$('#lerr').textContent='';init()}else $('#lerr').textContent=j.error;
};
async function init(){show('main');await loadFiles()}
async function loadFiles(){const r=await api('/api/files');FILES=await r.json();render()}

$('#pick').onchange=async e=>{
  const fs=[...e.target.files];let i=0;
  for(const f of fs){i++;await up(f,i,fs.length)}
  e.target.value='';$('#ustat').textContent='';loadFiles();
};
function up(f,i,n){return new Promise(res=>{
  const x=new XMLHttpRequest();x.open('POST','/api/upload');
  x.upload.onprogress=ev=>{if(ev.lengthComputable)$('#ustat').textContent=`Uploading ${i}/${n}: ${f.name} ${Math.round(ev.loaded/ev.total*100)}%`};
  x.onload=()=>{if(x.status!==200){try{alert(JSON.parse(x.responseText).error)}catch{}}res()};
  x.onerror=()=>{alert('Upload failed: '+f.name);res()};
  const fd=new FormData();fd.append('file',f);x.send(fd);
})}

function render(){
  const L=$('#list');L.innerHTML='';
  FILES.forEach(f=>{
    const meta=f.kind==='pdf'?`PDF · ${f.pages} page${f.pages>1?'s':''}`:'Image';
    const b=el('button',{className:'p',textContent:'🖨 Print'});
    b.onclick=()=>openPrint(f.name,Array.from({length:f.pages},(_,i)=>({f:f.id,p:i,land:f.lands[i],label:'Page '+(i+1)})));
    const d=el('button',{className:'x',textContent:'✕'});
    d.onclick=async()=>{await api('/api/files/'+f.id,{method:'DELETE'});loadFiles()};
    L.append(el('div',{className:'card'},el('div',{className:'row'},
      el('div',{className:'grow'},el('div',{className:'name',textContent:f.name}),el('div',{className:'mut',textContent:meta})),b,d)));
  });
  $('#all').hidden=!FILES.length;
  const A=$('#allbtns');A.innerHTML='';
  [['pdf','PDFs'],['img','images']].forEach(([k,t])=>{
    const fl=FILES.filter(f=>f.kind===k);if(!fl.length)return;
    const tot=fl.reduce((a,f)=>a+f.pages,0);
    const b=el('button',{className:'p',textContent:`🖨 Print all ${t} (${tot} page${tot>1?'s':''})`});
    b.onclick=()=>{let n=0,pages=[];fl.forEach(f=>{for(let i=0;i<f.pages;i++){n++;pages.push({f:f.id,p:i,land:f.lands[i],label:`${n}. ${f.name}${f.pages>1?' (p'+(i+1)+')':''}`})}});openPrint('All '+t,pages)};
    A.append(b);
  });
}
$('#clear').onclick=async()=>{if(confirm('Remove all files?')){await api('/api/files',{method:'DELETE'});loadFiles()}};

function msg(t){$('#pmsg').textContent=t}
function openPrint(title,pages){
  CUR={title,pages};$('#ptitle').textContent=title;
  const g=$('#pgrid');g.innerHTML='';
  pages.forEach(p=>{
    const lb=el('label',{className:'pg'},el('input',{type:'checkbox',checked:true}),
      el('img',{loading:'lazy',src:`/api/thumb?f=${p.f}&p=${p.p}`}),el('span',{textContent:p.label}));
    p.cb=lb.firstChild;g.append(lb);
  });
  msg('');$('#copies').value=1;$('#orient').value='auto';
  $('#dlg').hidden=false;loadPrinters();
}
$('#close').onclick=()=>{$('#dlg').hidden=true};

async function loadPrinters(){
  const s=$('#printer');s.innerHTML='';
  const r=await api('/api/printers');const l=await r.json();
  if(!Array.isArray(l)||!l.length){msg('No printer found on this PC.');return}
  l.forEach(p=>s.append(new Option(`${p.name}  [${p.usb?'USB':p.port}]${p.default?' ★':''}`,p.name)));
  s.onchange=loadCaps;loadCaps();
}
async function loadCaps(){
  msg('Reading printer settings…');
  const r=await api('/api/printer?name='+encodeURIComponent($('#printer').value));
  CAPS=await r.json();
  if(CAPS.error){msg('Error: '+CAPS.error);return}
  msg('');
  const P=$('#paper');P.innerHTML='';
  CAPS.papers.forEach(p=>P.append(new Option(p.name+(p.custom?' (custom)':'')+(p.name===CAPS.defaults.paper?' – driver default':''),p.name)));
  if(CAPS.defaults.paper)P.value=CAPS.defaults.paper;
  const C=$('#color');C.innerHTML='';
  if(CAPS.color){C.append(new Option('Color','color'));C.append(new Option('Black & White','mono'));C.value=CAPS.defaults.color?'color':'mono'}
  else C.append(new Option('Black & White (printer has no color)','mono'));
  $('#duprow').hidden=!CAPS.duplex;
  if(CAPS.duplex)$('#duplex').value=CAPS.defaults.duplex;
  const dn={off:'one side',long:'two-sided long edge',short:'two-sided short edge'};
  $('#dnote').textContent=`Driver default: ${CAPS.defaults.paper||'?'}, ${CAPS.defaults.color?'Color':'B&W'}${CAPS.duplex?', '+dn[CAPS.defaults.duplex]:''}`;
  loadProfiles();
}

/* ---- profiles: driver's own settings window opens on the PC, like Word's Printer Properties ---- */
async function loadProfiles(selId){
  const S=$('#profile');S.innerHTML='';S.append(new Option('None (normal way)',''));
  try{
    const l=await (await api('/api/profiles?printer='+encodeURIComponent($('#printer').value))).json();
    l.forEach(p=>S.append(new Option(p.name,p.id)));
  }catch{}
  S.value=selId||'';profChange();
}
function profChange(){
  const has=!!$('#profile').value;
  $('#bdel').hidden=!has;
  $('#duplex').disabled=has;
  $('#pnote').textContent=has
    ?'This profile controls the driver options (two-sided, paper type, quality…). Paper size, orientation, color and copies still follow the settings below.'
    :'Optional. With no profile, printing works the normal way.';
}
$('#profile').onchange=profChange;
$('#bprof').onclick=async()=>{
  if(!$('#printer').value)return;
  const name=prompt('Name for this profile (e.g. Epson Glossy High, Toshiba 2-sided):');
  if(!name||!name.trim())return;
  msg('⚠ A settings window is opening on the PC. Choose the options there and press OK.');
  try{
    const r=await api('/api/profiles/new',{method:'POST',headers:JH,body:JSON.stringify({printer:$('#printer').value,name:name.trim()})});
    const j=await r.json();
    if(!r.ok){msg('Error: '+j.error);return}
    pollProf(j.id);
  }catch(e){msg('Error: '+e.message)}
};
async function pollProf(id){
  const j=await (await api('/api/job/'+id)).json();
  if(j.state==='run')setTimeout(()=>pollProf(id),800);
  else if(j.state==='done'){msg('✓ Profile saved: '+j.profile.name);loadProfiles(j.profile.id)}
  else if(j.state==='cancel')msg('Cancelled on the PC. Nothing was saved.');
  else msg('Error: '+j.error);
}
$('#bdel').onclick=async()=>{
  const v=$('#profile').value;
  if(!v||!confirm('Delete this profile?'))return;
  await api('/api/profiles/'+v+'?printer='+encodeURIComponent($('#printer').value),{method:'DELETE'});
  loadProfiles();
};

const sel=()=>CUR.pages.filter(p=>p.cb.checked);
function orient(){
  const v=$('#orient').value;if(v!=='auto')return v;
  const s=sel()[0];return s&&s.land?'landscape':'portrait';
}
function params(){
  const pp=CAPS&&CAPS.papers?CAPS.papers.find(x=>x.name===$('#paper').value):null;
  return new URLSearchParams({printer:$('#printer').value,paper:$('#paper').value,color:$('#color').value,
    duplex:CAPS&&CAPS.duplex?$('#duplex').value:'off',orient:orient(),scale:$('#scale').value,pct:setPct($('#pct').value),
    w:(pp&&pp.w)||210,h:(pp&&pp.h)||297}).toString();
}

/* ---- scaling + preview ---- */
const SC=[['fit','Fit to printable area'],['actual','Actual size (100%)'],['fill','Fill page (crop)'],['custom','Custom %']];
const SCN={fit:'Whole page fitted inside the printable area. Nothing is cut off.',
  actual:'Real size. Anything outside the printer\'s printable area is cut off.',
  fill:'Page covers the whole printable area. The extra part is cropped.',
  custom:'Percent of the real size (100% = actual size), always centered. Anything outside the printable area is cut off.'};
['#scale','#pvscale'].forEach(id=>SC.forEach(([v,t])=>$(id).append(new Option(t,v))));
function setScale(v){
  $('#scale').value=v;$('#pvscale').value=v;$('#scnote').textContent=SCN[v];
  $('#pctbox').hidden=$('#pctr').hidden=v!=='custom';
  $('#pvpct').hidden=v!=='custom';
}
function setPct(v){
  v=Math.max(10,Math.min(400,Math.round(parseFloat(v)||100)));
  $('#pct').value=v;$('#pctr').value=Math.min(300,v);$('#pvpv').textContent=v+'%';return v;
}
let pctT=null;
function pctChanged(){if(!$('#pv').hidden){clearTimeout(pctT);pctT=setTimeout(pvShow,350)}}
$('#pct').oninput=()=>{if($('#pct').value!=='')pctChanged()};
$('#pct').onchange=()=>{setPct($('#pct').value);pctChanged()};
$('#pctr').oninput=()=>{setPct($('#pctr').value);pctChanged()};
$('#pctm').onclick=()=>{setPct((parseFloat($('#pct').value)||100)-5);pctChanged()};
$('#pctp').onclick=()=>{setPct((parseFloat($('#pct').value)||100)+5);pctChanged()};
setScale('fit');
$('#scale').onchange=()=>setScale($('#scale').value);
$('#pvscale').onchange=()=>{setScale($('#pvscale').value);pvShow()};
$('#pvpm').onclick=()=>{setPct((parseFloat($('#pct').value)||100)-5);pvShow()};
$('#pvpp').onclick=()=>{setPct((parseFloat($('#pct').value)||100)+5);pvShow()};

let PV={list:[],i:0,step:1};
const dupOn=()=>CAPS&&CAPS.duplex&&!$('#profile').value&&$('#duplex').value!=='off';
$('#bprev').onclick=()=>{
  const s=sel();if(!s.length)return alert('Select at least one page');
  if(!CAPS||CAPS.error)return alert('Select a printer first');
  PV={list:s,i:0,step:dupOn()?2:1};
  $('#pv').hidden=false;pvShow();
};
async function pvShow(){
  const q=params(),stage=$('#pvstage');stage.innerHTML='';
  const items=PV.list.slice(PV.i,PV.i+PV.step),n=PV.list.length;
  let left=items.length;
  $('#pvinfo').textContent='Loading preview…';
  items.forEach((p,k)=>{
    const im=el('img',{alt:''});
    im.onload=im.onerror=()=>{if(--left===0)pvInfo(q)};
    im.src=`/api/preview?f=${p.f}&p=${p.p}&${q}`;
    const cap=PV.step===2?(k===0?'Front':'Back')+` · page ${PV.i+k+1}`:`Page ${PV.i+1} of ${n}`;
    stage.append(el('div',{className:'pvsheet'},im,el('small',{className:'mut',textContent:cap})));
  });
  const a=PV.i+1,b=PV.i+items.length;
  $('#pvpos').textContent=(items.length>1?`${a}–${b}`:`${a}`)+` / ${n}`;
  $('#pvprev').disabled=PV.i<=0;
  $('#pvnext').disabled=PV.i+PV.step>=n;
}
async function pvInfo(q){
  try{
    const a=await (await api('/api/area?'+q)).json();
    $('#pvinfo').textContent=(a.driver?'From the printer driver: ':'Estimated (driver gave no area): ')+
      `paper ${a.pw.toFixed(0)} × ${a.ph.toFixed(0)} mm, printable area ${a.aw.toFixed(0)} × ${a.ah.toFixed(0)} mm.`+
      (dupOn()?' Two-sided: front and back are shown together.':'');
  }catch{$('#pvinfo').textContent=''}
}
$('#pvprev').onclick=()=>{PV.i=Math.max(0,PV.i-PV.step);pvShow()};
$('#pvnext').onclick=()=>{if(PV.i+PV.step<PV.list.length){PV.i+=PV.step;pvShow()}};
$('#pvclose').onclick=()=>{$('#pv').hidden=true;$('#pvstage').innerHTML=''};
let tx=null;
$('#pvstage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#pvstage').addEventListener('touchend',e=>{
  if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;
  if(dx<-50)$('#pvnext').click();else if(dx>50)$('#pvprev').click();
},{passive:true});

$('#bprint').onclick=async()=>{
  const s=sel();if(!s.length)return alert('Select at least one page');
  if(!CAPS||CAPS.error)return alert('Select a printer first');
  const copies=Math.max(1,Math.min(99,parseInt($('#copies').value)||1));
  const body={printer:$('#printer').value,paper:$('#paper').value,color:$('#color').value,
    duplex:CAPS.duplex?$('#duplex').value:'off',orient:orient(),copies,
    profile:$('#profile').value||'',scale:$('#scale').value,pct:setPct($('#pct').value),
    pages:s.map(p=>[p.f,p.p]),title:CUR.title};
  msg('Sending…');
  const r=await api('/api/print',{method:'POST',headers:JH,body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok){msg('Error: '+j.error);return}
  poll(j.id);
};
async function poll(id){
  const r=await api('/api/job/'+id);const j=await r.json();
  if(j.state==='run'){msg(`Printing ${j.done}/${j.total}…`);setTimeout(()=>poll(id),700)}
  else if(j.state==='done')msg('✓ Sent to printer');
  else msg('Error: '+j.error);
}
fetch('/api/files').then(r=>{if(r.status===401)show('login');else init()});
</script>
</body>
</html>
