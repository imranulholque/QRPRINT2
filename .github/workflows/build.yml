name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconsole --onefile --name PhonePrint --add-data "static;static" --hidden-import win32timezone app.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhonePrint
          path: dist/PhonePrint.exe
